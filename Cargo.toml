[package]
name = "key-cli"
version = "0.1.1"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"
# unused = { level = "allow", priority = -1 } # For exploratory dev.

[dependencies]
# -- Cli
clap = { version = "4", features = ["derive"] }
# -- Key
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# -- Others
derive_more = { version = "2", features = ["from", "display"] }
